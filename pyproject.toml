[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-scope"
version = "0.2.0"
description = "轻量、零配置的本地 LLM 多引擎监控工具(Ollama / vLLM / SGLang)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "textual>=1.0",
    "rich>=13.7",
    "psutil>=5.9",
    "requests>=2.31",
    "nvidia-ml-py>=12.560",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
llm-scope = "llmscope.cli:main"

[tool.setuptools.packages.find]
include = ["llmscope*"]
